name: Bindings Host

on:
  pull_request:
    paths:
      - "ffi/**"
      - "bindings/**"
      - "scripts/run-binding-tests.sh"
      - ".github/workflows/bindings-host.yml"
  push:
    branches: [main]
    paths:
      - "ffi/**"
      - "bindings/**"
      - "scripts/run-binding-tests.sh"
      - ".github/workflows/bindings-host.yml"
  workflow_dispatch:

jobs:
  host-matrix:
    name: Host binding suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Kotlin 2.0.x cannot parse newer runtime version strings
      # (java.lang.IllegalArgumentException in JavaVersion.parse), so both the
      # Gradle daemon and the Kotlin compile daemon must run on the JDK the
      # module targets (`kotlin { jvmToolchain(17) }`).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Run binding host tests
        run: |
          chmod +x scripts/run-binding-tests.sh
          ./scripts/run-binding-tests.sh
