name: Release

on:
  release:
    types:
      - created

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: aria-router

jobs:
  build:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            asset_os: linux_x86_64
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            asset_os: windows_x86_64
            archive: zip
          - name: linux-arm64
            os: ubuntu-24.04-arm
            asset_os: linux_arm64
            archive: tar.gz
          - name: macos
            os: macos-latest
            asset_os: macos
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Embed release tag (sans leading v) into aria-router -v/--version.
          export ARIA_ROUTER_VERSION="${TAG_NAME#v}"
          echo "ARIA_ROUTER_VERSION=$ARIA_ROUTER_VERSION"
          cargo build --release -p aria-router
          cargo build --release -p ariacompute-router-ffi

      - name: Package release archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          ASSET_OS: ${{ matrix.asset_os }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          ARCHIVE_NAME="router_${VERSION}_${ASSET_OS}.tar.gz"
          tar -czf "$ARCHIVE_NAME" -C target/release "$BIN_NAME"
          echo "ASSET_PATH=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Package release archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          ASSET_OS: ${{ matrix.asset_os }}
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          $archiveName = "router_${version}_$($env:ASSET_OS).zip"
          Compress-Archive -Path "target/release/$($env:BIN_NAME).exe" -DestinationPath $archiveName -Force
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET_PATH=$archiveName"

      - name: Package libaria_router_ffi (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          ASSET_OS: ${{ matrix.asset_os }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          ARCHIVE_NAME="libaria_router_ffi_${VERSION}_${ASSET_OS}.tar.gz"
          cd target/release
          if [[ -f libaria_router_ffi.dylib ]]; then
            tar -czf "../../$ARCHIVE_NAME" libaria_router_ffi.dylib
          elif [[ -f libaria_router_ffi.so ]]; then
            tar -czf "../../$ARCHIVE_NAME" libaria_router_ffi.so
          elif [[ -f libaria_router_ffi.a ]]; then
            tar -czf "../../$ARCHIVE_NAME" libaria_router_ffi.a
          else
            echo "No libaria_router_ffi shared/static library found in target/release" >&2
            ls -la
            exit 1
          fi
          cd ../..
          echo "FFI_ASSET_PATH=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Package libaria_router_ffi (Windows)
        if: matrix.archive == 'zip'
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          ASSET_OS: ${{ matrix.asset_os }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          ARCHIVE_NAME="libaria_router_ffi_${VERSION}_${ASSET_OS}.tar.gz"
          cd target/release
          if [[ -f aria_router_ffi.dll ]]; then
            FILES=(aria_router_ffi.dll)
            [[ -f aria_router_ffi.dll.lib ]] && FILES+=(aria_router_ffi.dll.lib)
            [[ -f aria_router_ffi.lib ]] && FILES+=(aria_router_ffi.lib)
            tar -czf "../../$ARCHIVE_NAME" "${FILES[@]}"
          else
            echo "No aria_router_ffi.dll found in target/release" >&2
            ls -la
            exit 1
          fi
          cd ../..
          echo "FFI_ASSET_PATH=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.FFI_ASSET_PATH }}
          token: ${{ secrets.ARIACOMPUTE_TOKEN }}

  # Language package publishes are fail-pass: must not block CLI/assets.
  publish-packages:
    name: Publish language packages (fail-pass)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Set package version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION"
      - name: npm @ariacompute/router-ts + router-rn
        continue-on-error: true
        run: |
          echo "npm publish handled by publish-npm.yml (router-ts / router-rn)"
          echo "npm publish stub (fail-pass)"
      - name: pub.dev package:aria_router
        continue-on-error: true
        run: |
          echo "pub.dev publish handled by publish-pub.yml (publisher ariacompute.com, package:aria_router)"
          echo "pub.dev publish stub (fail-pass)"
      - name: Maven Central com.ariacompute:router
        continue-on-error: true
        run: |
          echo "Maven publish handled by publish-maven.yml (vanniktech plugin -> Central Portal)"
          echo "Maven publish stub (fail-pass)"
      - name: CocoaPods Swift
        continue-on-error: true
        run: |
          echo "Configure COCOAPODS_TRUNK_TOKEN then: pod trunk push bindings/swift/AriaRouter.podspec"
          echo "CocoaPods publish stub (fail-pass)"
      - name: crates.io ariacompute-router
        continue-on-error: true
        run: |
          echo "crates.io publish handled by publish-cargo.yml (ariacompute-router + deps)"
          echo "crates.io publish stub (fail-pass)"
      - name: PyPI ariacompute-router
        continue-on-error: true
        run: |
          echo "PyPI publish handled by publish-pypi.yml (cibuildwheel platform wheels)"
          echo "PyPI publish stub (fail-pass)"
