name: Publish npm (@ariacompute/router-ts, @ariacompute/router-rn)

# Publish the TypeScript SDK (@ariacompute/router-ts) and the React Native
# binding (@ariacompute/router-rn) to npmjs.com under the `ariacompute`
# account. Both packages are plain JS (no tsc). Version is injected from
# the release tag via `npm version --no-git-tag-version --allow-same-version`
# (no git tag, no repo write-back; same version as package.json is a no-op).
# Publish failures are hard failures (no continue-on-error);
# republishing an existing version fails with npm 409 — bump the tag to
# re-release.
#
# Secrets required:
#   NPM_TOKEN — npmjs.com token for ~ariacompute with publish permission
#               on @ariacompute/router-ts and @ariacompute/router-rn
#               (granular access token, bypass 2FA for automation)

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (default: tag with v stripped)"
        required: false

jobs:
  router-ts:
    name: npm @ariacompute/router-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Resolve version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          fi
          [ -n "$VERSION" ] || VERSION="0.0.0"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version=$VERSION"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd bindings/typescript
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public

  router-rn:
    name: npm @ariacompute/router-rn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Resolve version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          fi
          [ -n "$VERSION" ] || VERSION="0.0.0"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version=$VERSION"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd bindings/react-native
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public
