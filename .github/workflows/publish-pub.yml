name: Publish pub.dev (package:ariarouter)

# Publish the Flutter binding (package:ariarouter) to pub.dev under
# the verified publisher ariacompute.com, so consumers can use:
#   dependencies:
#     ariarouter: <version>
#   import 'package:ariarouter/ariarouter.dart';
# Listed at https://pub.dev/publishers/ariacompute.com/packages
#
# Version is injected into bindings/flutter/pubspec.yaml and CHANGELOG.md
# from the release tag sans leading v (same parser as publish-npm.yml /
# publish-maven.yml). Publish runs from a copy outside the git worktree so
# the version inject does not trip pub's "checked-in file is modified" check.
# Publish failures are hard failures (no continue-on-error); pub.dev
# versions are immutable — republishing an existing version fails, bump
# the tag to re-release.
#
# Auth: GitHub secret PUB_CREDENTIALS must be a pub.dev *user* OAuth
# blob. Three identities are distinct and must not be mixed:
#   - WSL/local OS user that owns ~/.config/dart/pub-credentials.json
#     (file owner is irrelevant)
#   - GitHub Actions / ariacompute/router (OIDC cannot create a new
#     package: "Only users are allowed to upload new packages")
#   - pub.dev publisher member (the Google account that completed
#     `dart pub login` in the browser, e.g. jia@ariacompute.com)
#
# Obtain the secret (any machine; OS user does not matter):
#   dart pub logout
#   dart pub login          # browser: sign in as the publisher member
#   cat ~/.config/dart/pub-credentials.json
# Store that JSON as repo secret PUB_CREDENTIALS.
# Do not use a login performed as a personal/WSL Google account.
#
# First publish creates the package under that pub.dev user. Transfer it
# at https://pub.dev/packages/ariarouter/admin to publisher
# ariacompute.com.

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (default: tag with v stripped)"
        required: false

jobs:
  publish:
    name: pub.dev package:ariarouter
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          fi
          [ -n "$VERSION" ] || VERSION="0.0.0"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version=$VERSION"
      - name: Inject version into pubspec.yaml and CHANGELOG.md
        run: |
          sed -i.bak "s/^version: .*/version: $VERSION/" bindings/flutter/pubspec.yaml
          rm -f bindings/flutter/pubspec.yaml.bak
          grep -E '^name:|^version:' bindings/flutter/pubspec.yaml
          CHANGELOG=bindings/flutter/CHANGELOG.md
          if ! grep -qE "^##[[:space:]]+$VERSION([[:space:]]|$)" "$CHANGELOG"; then
            tmp="$(mktemp)"
            {
              echo "# Changelog"
              echo
              echo "## $VERSION"
              echo
              echo "- Release $VERSION of package:ariarouter."
              echo
              awk 'NR==1 && /^# / { next } { print }' "$CHANGELOG"
            } > "$tmp"
            mv "$tmp" "$CHANGELOG"
          fi
          grep -E '^## ' "$CHANGELOG" | head -5
      - name: Configure pub.dev credentials
        env:
          PUB_CREDENTIALS: ${{ secrets.PUB_CREDENTIALS }}
        run: |
          if [ -z "$PUB_CREDENTIALS" ]; then
            echo "::error::PUB_CREDENTIALS must be ~/.config/dart/pub-credentials.json from \`dart pub login\` as the pub.dev publisher member (not the WSL OS user, not GitHub Actions). GitHub OIDC cannot create a new package."
            exit 1
          fi
          mkdir -p "$HOME/.config/dart" "$HOME/.pub-cache"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.config/dart/pub-credentials.json"
          printf '%s' "$PUB_CREDENTIALS" > "$HOME/.pub-cache/credentials.json"
          chmod 600 "$HOME/.config/dart/pub-credentials.json" "$HOME/.pub-cache/credentials.json"
          rm -f "$HOME/.config/dart/pub-tokens.json"
          echo "Wrote PUB_CREDENTIALS to ~/.config/dart/pub-credentials.json"
      - name: Publish to pub.dev
        run: |
          STAGE="${RUNNER_TEMP:-/tmp}/ariarouter"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -a bindings/flutter/. "$STAGE/"
          rm -rf "$STAGE/.dart_tool" "$STAGE/build"
          cd "$STAGE"
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN || true
          flutter pub get
          flutter pub publish --dry-run
          flutter pub publish --force
