# Gateway semantic config (YAML v0.3) — **advanced** aria recipe.
# Intentionally ahead of bench/vllm-sr/config-gateway.yaml (keyword baseline).
# Entrypoint: ariacompute/semantic-auto → recipe mom.
# Gold path: explain+high band → large; factoid → small; systems/trade-off → mid;
# multi-turn/question → mid; long prompt → latency-aware / multi-factor; else → small.
# Requires: export GATEWAY_API_KEY=…  (never commit secrets).

version: v0.3

listeners:
  - name: http
    address: 127.0.0.1
    port: 8899

providers:
  defaults:
    default_model: ariacompute/ariamodel-mid
  models:
    - name: ariacompute/ariamodel-small
      provider_model_id: qwen3.5-flash
      tier: small
      locality: cloud
      modality: text
      capabilities: [chat]
      pricing:
        input_per_mtok: 0.10
        output_per_mtok: 0.20
      backend_refs:
        - name: cloud/gateway
          base_url: https://tokenhub.tencentmaas.com
          protocol: http
          weight: 100
          api_key_env: GATEWAY_API_KEY
    - name: ariacompute/ariamodel-mid
      provider_model_id: glm-5.3
      tier: mid
      locality: cloud
      modality: text
      capabilities: [chat]
      pricing:
        input_per_mtok: 0.40
        output_per_mtok: 0.80
      backend_refs:
        - name: cloud/gateway
          base_url: https://tokenhub.tencentmaas.com
          protocol: http
          weight: 100
          api_key_env: GATEWAY_API_KEY
    - name: ariacompute/ariamodel-large
      provider_model_id: deepseek-v4-pro
      tier: large
      locality: cloud
      modality: text
      capabilities: [chat]
      pricing:
        input_per_mtok: 1.20
        output_per_mtok: 2.40
      backend_refs:
        - name: cloud/gateway
          base_url: https://tokenhub.tencentmaas.com
          protocol: http
          weight: 100
          api_key_env: GATEWAY_API_KEY

entrypoints:
  - model_names: [ariacompute/semantic-auto]
    router: semantic
    recipe: mom

recipes:
  - name: mom
    router: semantic
    routing:
      strategy: priority
      signals:
        keywords:
          - name: needs_explain
            operator: OR
            keywords: ["explain", "walk me through"]
          - name: factoid_small
            operator: OR
            keywords:
              - "boiling point"
              - "stand for"
              - "what does"
              - "CPU"
              - "acronym"
              - "in celsius"
          - name: needs_mid
            operator: OR
            keywords: ["reverse proxy", "trade-off", "tradeoff"]
        language:
          - name: english
            code: en
        context:
          - name: long_prompt
            min_tokens: 256
            max_tokens: 8192
        authz:
          - name: admin_role
            role: admin
        conversation:
          - name: multi_turn
            min_messages: 2
        metadata:
          - name: tenant_acme
            key: tenant
            value: acme
        event:
          - name: ticket
            code: TICKET-
        structure:
          - name: multi_question
            min_questions: 2
      projections:
        - name: topic
          type: partition
          signals: [needs_explain, needs_mid, factoid_small, ticket]
        - name: explain_score
          type: score
          weights:
            needs_explain: 1.0
            needs_mid: 0.5
            long_prompt: 0.3
        - name: explain_band
          type: mapping
          from: explain_score
          bands:
            - name: high
              min: 0.8
              max: 1.0
            - name: default
              min: 0.0
              max: 0.8
      decisions:
        - name: explanatory
          description: Strong explain signal (projection band high) → large
          priority: 100
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: needs_explain
              - type: projection
                name: explain_band
                equals: high
          modelRefs:
            - model: ariacompute/ariamodel-large
          algorithm: static
          plugins:
            - name: system-prompt
              content: Answer briefly and cite the routed model.
            - name: header-mutation
              set:
                x-aria-route: explanatory
        - name: factoid
          description: Short factual prompts → small (beats systems_mid traps)
          priority: 90
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: factoid_small
          modelRefs:
            - model: ariacompute/ariamodel-small
          algorithm: static
          plugins:
            - name: header-mutation
              set:
                x-aria-route: factoid
        - name: long_context
          description: Long prompt → multi-factor (cost+latency) over pool
          priority: 80
          rules:
            operator: AND
            conditions:
              - type: context
                name: long_prompt
          modelRefs:
            - model: ariacompute/ariamodel-small
            - model: ariacompute/ariamodel-mid
            - model: ariacompute/ariamodel-large
          algorithm: multi-factor
        - name: systems_mid
          description: Systems / trade-off prompts → static mid tier
          priority: 70
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: needs_mid
          modelRefs:
            - model: ariacompute/ariamodel-mid
          algorithm: static
          plugins:
            - name: header-mutation
              set:
                x-aria-route: systems_mid
        - name: multi_turn
          description: Multi-turn chat → static mid tier
          priority: 60
          rules:
            operator: AND
            conditions:
              - type: conversation
                name: multi_turn
          modelRefs:
            - model: ariacompute/ariamodel-mid
          algorithm: static
        - name: multi_question
          description: Multi-question structure → static mid tier
          priority: 50
          rules:
            operator: AND
            conditions:
              - type: structure
                name: multi_question
          modelRefs:
            - model: ariacompute/ariamodel-mid
          algorithm: static
        - name: fallback_pool
          description: Default → small + response-cache
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: ariacompute/ariamodel-small
          algorithm: static
          plugins:
            - name: response-cache

global:
  require_api_key: false
