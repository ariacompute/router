# Gold-path agent config (YAML v0.3).
# Entrypoint: ariacompute/agent-auto. In-process builtin agent (fixed tools + max_turns).
# No endpoint → first-eligible (demo/CI). Set agent.endpoint for a real router LLM.
# entrypoint.router must equal recipe.router.

version: v0.3

listeners:
  - name: http
    address: 127.0.0.1
    port: 8899

providers:
  defaults:
    default_model: local/general
  models:
    - name: local/general
      provider_model_id: echo
      locality: local
      modality: text
      capabilities: [chat]
      backend_refs:
        - name: primary
          endpoint: 127.0.0.1:8000

entrypoints:
  - model_names: [ariacompute/agent-auto]
    router: agent
    recipe: agent-default

recipes:
  - name: agent-default
    router: agent
    agent:
      timeout_ms: 5000
      max_turns: 3
      fallback: local/general
      prompt: |
        Use tools if needed, then submit_route with one eligible model.

global:
  require_api_key: false
