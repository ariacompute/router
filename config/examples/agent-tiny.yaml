version: v0.3
listeners:
  - name: http
    address: 127.0.0.1
    port: 8899
providers:
  defaults:
    default_model: local/general
  models:
    - name: local/general
      provider_model_id: echo
      locality: local
      modality: text
      capabilities: [chat]
      backend_refs:
        - name: primary
          endpoint: 127.0.0.1:8000
extensions:
  - name: builtin
    type: builtin
entrypoints:
  - model_names: [aria/agent-auto]
    router: agent
    recipe: agent-default
recipes:
  - name: agent-default
    router: agent
    agent:
      extension: builtin
      fallback: local/general
      prompt: |
        Choose one eligible model for this request.
