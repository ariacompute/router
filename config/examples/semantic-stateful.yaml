# Stage R: retention sticky + memory / semantic_cache / soft ratelimit / replay.
# Entrypoint: ariacompute/semantic-auto. Keyword "explain" → local/general with retention.
# validate / serve without ML weights. Enable stores under global.

version: v0.3

listeners:
  - name: http
    address: 127.0.0.1
    port: 8899

providers:
  defaults:
    default_model: local/general
  models:
    - name: local/general
      provider_model_id: echo
      locality: local
      modality: text
      capabilities: [chat]
      backend_refs:
        - name: primary
          endpoint: 127.0.0.1:8000
    - name: local/fast
      provider_model_id: echo-fast
      locality: local
      modality: text
      capabilities: [chat]
      backend_refs:
        - name: primary
          endpoint: 127.0.0.1:8001

entrypoints:
  - model_names: [ariacompute/semantic-auto]
    router: semantic
    recipe: mom

recipes:
  - name: mom
    router: semantic
    routing:
      strategy: priority
      signals:
        keywords:
          - name: needs_explain
            operator: OR
            keywords: ["explain", "walk me through"]
      decisions:
        - name: explanatory
          priority: 100
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: needs_explain
          modelRefs:
            - model: local/general
          emits:
            - kind: retention
              retention:
                drop: false
                ttl_turns: 2
                keep_current_model: true
        - name: default_fast
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: local/fast

global:
  require_api_key: false
  model_catalog:
    embed_hash:
      kind: hash
      dim: 64
  stores:
    memory:
      enabled: true
      max_sessions: 4096
      default_ttl_turns: 2
    semantic_cache:
      enabled: true
      similarity_threshold: 0.85
      max_entries: 1024
      ttl_turns: 4
  services:
    ratelimit:
      enabled: false
      requests_per_minute: 120
    router_replay:
      enabled: true
      max_items: 256
