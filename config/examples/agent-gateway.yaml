# Gateway agent gold path (YAML v0.3) — Track B **agent** ladder (§6.8).
# Entrypoint: ariacompute/agent-auto. Builtin agent decides among ariamodel-{small,mid,large}.
# Backends: TokenHub (aligned with semantic-gateway); peer = vllm keyword baseline (frozen).
# XOR with semantic-gateway on :8899. Requires: export GATEWAY_API_KEY=…  (never commit secrets).
# entrypoint.router must equal recipe.router.

version: v0.3

listeners:
  - name: http
    address: 127.0.0.1
    port: 8899

providers:
  defaults:
    default_model: ariacompute/ariamodel-mid
  models:
    - name: ariacompute/ariamodel-small
      provider_model_id: qwen3.5-flash
      locality: cloud
      modality: text
      capabilities: [chat]
      pricing:
        input_per_mtok: 0.10
        output_per_mtok: 0.20
      backend_refs:
        - name: cloud/gateway
          base_url: https://tokenhub.tencentmaas.com
          protocol: http
          weight: 100
          api_key_env: GATEWAY_API_KEY
    - name: ariacompute/ariamodel-mid
      provider_model_id: glm-5.3
      locality: cloud
      modality: text
      capabilities: [chat]
      pricing:
        input_per_mtok: 0.40
        output_per_mtok: 0.80
      backend_refs:
        - name: cloud/gateway
          base_url: https://tokenhub.tencentmaas.com
          protocol: http
          weight: 100
          api_key_env: GATEWAY_API_KEY
    - name: ariacompute/ariamodel-large
      provider_model_id: deepseek-v4-pro
      locality: cloud
      modality: text
      capabilities: [chat]
      pricing:
        input_per_mtok: 1.20
        output_per_mtok: 2.40
      backend_refs:
        - name: cloud/gateway
          base_url: https://tokenhub.tencentmaas.com
          protocol: http
          weight: 100
          api_key_env: GATEWAY_API_KEY

entrypoints:
  - model_names: [ariacompute/agent-auto]
    router: agent
    recipe: agent-default

recipes:
  - name: agent-default
    router: agent
    agent:
      endpoint: https://tokenhub.tencentmaas.com
      model: ariacompute/ariamodel-mid
      timeout_ms: 30000
      max_turns: 3
      fallback: ariacompute/ariamodel-mid
      prompt: |
        Use tools if needed, then submit_route with one eligible model
        (prefer ariamodel-large for explanations; ariamodel-small for short factual asks).

global:
  require_api_key: false
