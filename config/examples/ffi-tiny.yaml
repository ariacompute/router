# Gold-path FFI config (YAML v0.3).
# Entrypoint: aria/semantic-auto. fast-response returns a canned completion so
# binding tests need no upstream. Backend 127.0.0.1:9 is unused on this path.
# Prefer this file in cases.json / run-binding-tests.sh. See ffi.yaml for catalog.
# entrypoint.router must equal recipe.router.

version: v0.3

# Data-plane bind hint. FFI init does not open this listener.
listeners:
  - name: http
    address: 127.0.0.1
    port: 8899

# Unused when fast-response short-circuits.
providers:
  defaults:
    default_model: local/general
  models:
    - name: local/general
      provider_model_id: echo
      locality: local
      modality: text
      capabilities: [chat]
      backend_refs:
        - name: primary
          endpoint: 127.0.0.1:9

entrypoints:
  - model_names: [aria/semantic-auto]
    router: semantic
    recipe: mom

recipes:
  - name: mom
    router: semantic
    routing:
      strategy: priority
      signals:
        keywords: []
      decisions:
        - name: canned
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: local/general
          plugins:
            - name: fast-response
              message: hello-from-router

# Gold-path demos: no Bearer required (setup default is require_api_key: true).
global:
  require_api_key: false
