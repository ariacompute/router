# Catalog agent config (YAML v0.3).
# Declares builtin, pi, and deepseek-harness. validate succeeds.
# serve FAILS CLOSED if `pi` or the deepseek-harness command is not on PATH
# (ensure_extensions_startable). Daily serve should use agent-tiny.yaml
# (builtin only).
# Entrypoints: aria/agent-auto (builtin), aria/agent-pi, aria/agent-dsh.
# entrypoint.router must equal recipe.router. Secrets: ${VAR} / ${VAR:-default}.

version: v0.3

# Data-plane bind hint (used as --bind default).
listeners:
  - name: http-8899
    address: 127.0.0.1
    port: 8899
    timeout: 300s

# Eligible pool for the agent. locality is a hard constraint before tools run.
# Fallback / recipes use local/*; private/cloud are catalog examples (eligible when
# the request Location allows them, or via concrete-name bypass).
providers:
  defaults:
    default_model: local/general
  models:
    - name: local/fast
      provider_model_id: echo-fast
      locality: local
      modality: text
      capabilities: [chat]
      backend_refs:
        - name: primary
          endpoint: 127.0.0.1:8000
          protocol: http
          weight: 70
          api_key_env: ${ARIA_UPSTREAM_KEY:-}
    - name: local/general
      provider_model_id: echo
      locality: local
      modality: text
      capabilities: [chat]
      backend_refs:
        - name: primary
          endpoint: 127.0.0.1:8000
          protocol: http
          weight: 100
          api_key_env: ${ARIA_UPSTREAM_KEY:-}
    # Private VPC / on-prem OpenAI-compatible endpoint (not loopback).
    - name: private/general
      provider_model_id: private-echo
      locality: private
      modality: text
      capabilities: [chat]
      backend_refs:
        - name: primary
          endpoint: 10.0.0.10:8000
          protocol: http
          weight: 100
          api_key_env: ${ARIA_PRIVATE_KEY:-}
      pricing:
        input_per_mtok: 0.05
        output_per_mtok: 0.15
    # Public cloud API — prefer base_url + https; secrets via env expansion.
    - name: cloud/general
      provider_model_id: cloud-echo
      locality: cloud
      modality: text
      capabilities: [chat]
      backend_refs:
        - name: primary
          base_url: https://api.example.com/v1
          protocol: http
          weight: 100
          api_key_env: ${ARIA_CLOUD_KEY:-}
      pricing:
        input_per_mtok: 0.15
        output_per_mtok: 0.60

# Optional observability / classifier asset blob.
global:
  require_api_key: false

# All listed extension types are checked at serve start. Missing binary → no start.
extensions:
  - name: builtin
    type: builtin
    endpoint: http://127.0.0.1:8000
    timeout_ms: 8000
  - name: pi
    type: pi
    # JSONL RPC: `pi --mode rpc`. serve requires this binary on PATH.
    command: [pi, --mode, rpc]
    workdir: .
    timeout_ms: 15000
    env:
      PI_LOG: ${PI_LOG:-warn}
  - name: dsh
    type: deepseek-harness
    # stdin: one JSON line with a RouteDecision. serve requires this command.
    command: [deepseek-harness]
    workdir: .
    timeout_ms: 15000

entrypoints:
  - model_names: [aria/agent-auto]
    router: agent
    recipe: agent-default
  - model_names: [aria/agent-pi]
    router: agent
    recipe: agent-pi
  - model_names: [aria/agent-dsh]
    router: agent
    recipe: agent-dsh

recipes:
  # In-process tool-call JSON. Chat works only after serve starts (needs pi + dsh bins).
  - name: agent-default
    router: agent
    agent:
      extension: builtin
      fallback: local/general
      max_turns: 4
      timeout_ms: 8000
      model: router-llm
      endpoint: http://127.0.0.1:8000
      prompt: |
        Choose one eligible model for this request.
        Return typed RouteDecision JSON only.
  - name: agent-pi
    router: agent
    agent:
      extension: pi
      fallback: local/general
      max_turns: 8
      timeout_ms: 15000
      prompt: |
        Route via pi JSONL RPC.
  - name: agent-dsh
    router: agent
    agent:
      extension: dsh
      fallback: local/general
      max_turns: 8
      timeout_ms: 15000
      prompt: |
        Route via deepseek-harness stdin JSON.
