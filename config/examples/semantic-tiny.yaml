# Gold-path semantic config (YAML v0.3).
# Entrypoint: aria/semantic-auto. Keyword "explain" / "walk me through" → local/general.
# validate and serve work without ML weights or extra binaries.
# Prefer this file for daily serve. See semantic.yaml for the stage B–C catalog.
# entrypoint.router must equal recipe.router.

version: v0.3

# Data-plane bind hint (used as --bind default).
listeners:
  - name: http
    address: 127.0.0.1
    port: 8899

# Named models. locality is a hard constraint (local|private|cloud).
providers:
  defaults:
    default_model: local/general
  models:
    - name: local/general
      provider_model_id: echo
      locality: local
      modality: text
      capabilities: [chat]
      backend_refs:
        - name: primary
          endpoint: 127.0.0.1:8000

# Unused on this gold path; listed so agent examples can share the same skeleton.
extensions:
  - name: builtin
    type: builtin

# Virtual name → recipe. Concrete provider names bypass recipes.
entrypoints:
  - model_names: [aria/semantic-auto]
    router: semantic
    recipe: mom

recipes:
  - name: mom
    router: semantic
    routing:
      strategy: priority
      # Heuristic keyword only (stage A).
      signals:
        keywords:
          - name: needs_explain
            operator: OR
            keywords: ["explain", "walk me through"]
      decisions:
        - name: explanatory
          priority: 100
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: needs_explain
          modelRefs:
            - model: local/general
