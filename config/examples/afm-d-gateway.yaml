# Gateway AFM-D gold path (YAML v0.3).
# Entrypoint: ariacompute/afm-d-auto. AFM-D System One chooses among ariamodel-{small,mid,large}.
# Backends: TokenHub (aligned with semantic-gateway / agent-gateway).
# XOR with other gateways on :8899. Requires: export GATEWAY_API_KEY=…
# Also needs aria-engine System One at DECISION_MODEL_URL (default :8010 encoder).
#   aria-engine serve --track encoder --bind 127.0.0.1:8010
# Decoder serve uses :8011 (`--track decoder`); set track: decoder if pointing there.
# entrypoint.router must equal recipe.router.

version: v0.3

listeners:
  - name: http
    address: 127.0.0.1
    port: 8899

providers:
  defaults:
    default_model: ariacompute/ariamodel-mid
  models:
    - name: ariacompute/ariamodel-small
      provider_model_id: glm-5.3-flash
      tier: small
      locality: cloud
      modality: text
      capabilities: [chat]
      pricing:
        input_per_mtok: 0.10
        output_per_mtok: 0.20
      backend_refs:
        - name: cloud/gateway
          base_url: https://tokenhub.tencentmaas.com
          protocol: http
          weight: 100
          api_key_env: GATEWAY_API_KEY
    - name: ariacompute/ariamodel-mid
      provider_model_id: glm-5.3
      tier: mid
      locality: cloud
      modality: text
      capabilities: [chat]
      pricing:
        input_per_mtok: 0.40
        output_per_mtok: 0.80
      backend_refs:
        - name: cloud/gateway
          base_url: https://tokenhub.tencentmaas.com
          protocol: http
          weight: 100
          api_key_env: GATEWAY_API_KEY
    - name: ariacompute/ariamodel-large
      provider_model_id: deepseek-v4-pro
      tier: large
      locality: cloud
      modality: text
      capabilities: [chat]
      pricing:
        input_per_mtok: 1.20
        output_per_mtok: 2.40
      backend_refs:
        - name: cloud/gateway
          base_url: https://tokenhub.tencentmaas.com
          protocol: http
          weight: 100
          api_key_env: GATEWAY_API_KEY

entrypoints:
  - model_names: [ariacompute/afm-d-auto]
    router: afm-d
    recipe: afm-d-default

recipes:
  - name: afm-d-default
    router: afm-d
    afm-d:
      endpoint: "${DECISION_MODEL_URL:-http://127.0.0.1:8010}"
      track: encoder
      timeout_ms: 5000
      fallback: ariacompute/ariamodel-mid
      instructions: |
        Pick the cheapest sufficient model tier for the user message. Prefer smaller tiers.
        small = greetings/chitchat, factoids, acronyms/stand-for, unit conversions, MCQ letter answers, yes/no, one-line definitions,
          arithmetic (e.g. "1+1=?", "what is 7×8"), short lookups / noun phrases (e.g. "china emergency call", "capital of france", phone/emergency numbers),
          bare "what is <noun>?" / "what is the X?" lookups WITHOUT explain/walk-through/teach verbs
          (capitals, planets, chromosome counts, chemical symbols, boiling points, H2O, etc.)
        mid = systems judgment, trade-offs, reverse-proxy/placement, "when to use A versus B", design choices,
          multi-question comparisons ("what is A? what is B?") — these are mid, NOT large
        large = ONLY explicit teaching / how-it-works / walkthrough verbs (explain, walk me through, how does X work, teach, introduce)
          — never MCQ letter-only prompts, never bare short factoids
        Never pick large for arithmetic, "What does X stand for?", boiling points, unit conversion, short facts,
          capitals/planets/counts/symbols, emergency/phone-number noun phrases, brief lookups without explain verbs,
          or multiple-choice letter answers.
        "when to use" / versus / trade-off / design choice → mid (not large).
        When unsure between small and large on a short message, pick small.
        When unsure between mid and large without an explain/teach verb, pick mid.
      descriptions:
        ariacompute/ariamodel-small: small — greetings, factoids, arithmetic, noun-phrase lookups (emergency/phone numbers, capital of X), acronyms/stand-for, bare what-is, MCQ, yes/no, unit conversion
        ariacompute/ariamodel-mid: mid — systems judgment, trade-offs, when-to-use/versus, reverse-proxy placement, multi-question comparisons, design choices
        ariacompute/ariamodel-large: large — only explain / walk-through / how-it-works / teach / introduce (not bare what-is/noun-phrase factoids, not when-to-use/versus)

global:
  require_api_key: false
