# Triad Gateway — semantic + agent + afm-d entrypoints in one process.
# For Track E routing-accuracy (`scripts/run-routing-accuracy.sh`).
# Entrypoints:
#   ariacompute/semantic-auto  → recipe mom
#   ariacompute/agent-auto     → recipe agent-default
#   ariacompute/afm-d-auto     → recipe afm-d-default
# Requires: export GATEWAY_API_KEY=…
# AFM-D also needs aria-engine System One at DECISION_MODEL_URL (default :8010).
#   aria-engine serve --track encoder --bind 127.0.0.1:8010

version: v0.3

listeners:
  - name: http
    address: 127.0.0.1
    port: 8899

providers:
  defaults:
    default_model: ariacompute/ariamodel-mid
  models:
    - name: ariacompute/ariamodel-small
      provider_model_id: qwen3.5-flash
      tier: small
      locality: cloud
      modality: text
      capabilities: [chat]
      pricing:
        input_per_mtok: 0.10
        output_per_mtok: 0.20
      backend_refs:
        - name: cloud/gateway
          base_url: https://tokenhub.tencentmaas.com
          protocol: http
          weight: 100
          api_key_env: GATEWAY_API_KEY
    - name: ariacompute/ariamodel-mid
      provider_model_id: glm-5.3
      tier: mid
      locality: cloud
      modality: text
      capabilities: [chat]
      pricing:
        input_per_mtok: 0.40
        output_per_mtok: 0.80
      backend_refs:
        - name: cloud/gateway
          base_url: https://tokenhub.tencentmaas.com
          protocol: http
          weight: 100
          api_key_env: GATEWAY_API_KEY
    - name: ariacompute/ariamodel-large
      provider_model_id: deepseek-v4-pro
      tier: large
      locality: cloud
      modality: text
      capabilities: [chat]
      pricing:
        input_per_mtok: 1.20
        output_per_mtok: 2.40
      backend_refs:
        - name: cloud/gateway
          base_url: https://tokenhub.tencentmaas.com
          protocol: http
          weight: 100
          api_key_env: GATEWAY_API_KEY

entrypoints:
  - model_names: [ariacompute/semantic-auto]
    router: semantic
    recipe: mom
  - model_names: [ariacompute/agent-auto]
    router: agent
    recipe: agent-default
  - model_names: [ariacompute/afm-d-auto]
    router: afm-d
    recipe: afm-d-default

recipes:
  - name: mom
    router: semantic
    routing:
      strategy: priority
      signals:
        keywords:
          - name: needs_explain
            operator: OR
            keywords: ["explain", "walk me through"]
          - name: needs_intro
            operator: OR
            keywords: ["introduce", "introduction to", "what is", "what are", "how to", "how does", "overview of", "teach"]
          - name: factoid_small
            operator: OR
            keywords:
              - "boiling point"
              - "stand for"
              - "what does"
              - "CPU"
              - "acronym"
              - "in celsius"
          - name: needs_mid
            operator: OR
            keywords: ["reverse proxy", "trade-off", "tradeoff"]
        language:
          - name: english
            code: en
        context:
          - name: long_prompt
            min_tokens: 256
            max_tokens: 8192
        authz:
          - name: admin_role
            role: admin
        conversation:
          - name: multi_turn
            min_messages: 2
        metadata:
          - name: tenant_acme
            key: tenant
            value: acme
        event:
          - name: ticket
            code: TICKET-
        structure:
          - name: multi_question
            min_questions: 2
      projections:
        - name: topic
          type: partition
          signals: [needs_explain, needs_mid, factoid_small, ticket]
        - name: explain_score
          type: score
          weights:
            needs_explain: 1.0
            needs_mid: 0.5
            long_prompt: 0.3
        - name: explain_band
          type: mapping
          from: explain_score
          bands:
            - name: high
              min: 0.8
              max: 1.0
            - name: default
              min: 0.0
              max: 0.8
      decisions:
        - name: explanatory
          description: Strong explain signal (projection band high) → large
          priority: 100
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: needs_explain
              - type: projection
                name: explain_band
                equals: high
          modelRefs:
            - model: ariacompute/ariamodel-large
          algorithm: static
          plugins:
            - name: system-prompt
              content: Answer briefly and cite the routed model.
            - name: header-mutation
              set:
                x-aria-route: explanatory
        - name: intro_teach
          description: Intro / teaching asks (introduce X, what is X, how to) -> large
          priority: 95
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: needs_intro
          modelRefs:
            - model: ariacompute/ariamodel-large
          algorithm: static
          plugins:
            - name: system-prompt
              content: Answer thoroughly and teach the concept; cite the routed model.
            - name: header-mutation
              set:
                x-aria-route: intro_teach
        - name: factoid
          description: Short factual prompts → small (beats systems_mid traps)
          priority: 90
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: factoid_small
          modelRefs:
            - model: ariacompute/ariamodel-small
          algorithm: static
          plugins:
            - name: header-mutation
              set:
                x-aria-route: factoid
        - name: long_context
          description: Long prompt → multi-factor (cost+latency) over pool
          priority: 80
          rules:
            operator: AND
            conditions:
              - type: context
                name: long_prompt
          modelRefs:
            - model: ariacompute/ariamodel-small
            - model: ariacompute/ariamodel-mid
            - model: ariacompute/ariamodel-large
          algorithm: multi-factor
        - name: systems_mid
          description: Systems / trade-off prompts → static mid tier
          priority: 70
          rules:
            operator: AND
            conditions:
              - type: keyword
                name: needs_mid
          modelRefs:
            - model: ariacompute/ariamodel-mid
          algorithm: static
          plugins:
            - name: header-mutation
              set:
                x-aria-route: systems_mid
        - name: multi_turn
          description: Multi-turn chat → static mid tier
          priority: 60
          rules:
            operator: AND
            conditions:
              - type: conversation
                name: multi_turn
          modelRefs:
            - model: ariacompute/ariamodel-mid
          algorithm: static
        - name: multi_question
          description: Multi-question structure → static mid tier
          priority: 50
          rules:
            operator: AND
            conditions:
              - type: structure
                name: multi_question
          modelRefs:
            - model: ariacompute/ariamodel-mid
          algorithm: static
        - name: fallback_pool
          description: Default → small + response-cache
          priority: 1
          rules:
            operator: AND
            conditions: []
          modelRefs:
            - model: ariacompute/ariamodel-small
          algorithm: static
          plugins:
            - name: response-cache

  - name: agent-default
    router: agent
    agent:
      endpoint: https://tokenhub.tencentmaas.com
      model: ariacompute/ariamodel-mid
      timeout_ms: 45000
      max_turns: 4
      fallback: ariacompute/ariamodel-mid
      prompt: |
        You are the aria-router builtin agent. Use tools if helpful, then call
        submit_route with exactly one eligible model. JSON tools only.
        Include a short reason that names the chosen tier (large / mid / small).

        Tier policy (intent → tier; do not default to mid without reason):
        - large: teaching or explaining a mechanism/process (how something works),
          even if the user asks for one sentence or brief form. Prefer large whenever
          the ask is explanatory rather than a pure fact.
        - mid: systems and engineering judgment — trade-offs, when to use an
          architecture, naming benefits of infra patterns (e.g. reverse proxy),
          multi-concept compare ("what is A? what is B?"), design choices.
        - small: pure factoids, acronyms/"stand for", unit conversions, greetings.
          Never route an explain/how-it-works ask to small just because the prompt
          is short.

        Match eligible models by their tier field (or name suffix). Upstream
        provider_model_id may vary; do not key routing on upstream ids.

        Priority when intents overlap: explanatory (large) > systems/trade-off (mid)
        > pure factoid (small).

  - name: afm-d-default
    router: afm-d
    afm-d:
      endpoint: "${DECISION_MODEL_URL:-http://127.0.0.1:8010}"
      track: encoder
      timeout_ms: 5000
      fallback: ariacompute/ariamodel-mid
      instructions: |
        Pick the cheapest sufficient model tier for the user message. Prefer smaller tiers.
        small = greetings/chitchat, factoids, acronyms/stand-for, unit conversions, MCQ letter answers, yes/no, one-line definitions,
          arithmetic (e.g. "1+1=?", "what is 7×8"), short lookups / noun phrases (e.g. "china emergency call", "capital of france", phone/emergency numbers)
        mid = systems judgment, trade-offs, reverse-proxy/placement, multi-question comparisons
        large = ONLY explicit teaching / how-it-works / walkthrough (explain, walk me through, how does X work) — never MCQ letter-only prompts
        Never pick large for arithmetic, "What does X stand for?", boiling points, unit conversion, short facts,
          brief lookups without explain verbs, or multiple-choice letter answers.
        When unsure between small and large on a short message, pick small.
      descriptions:
        ariacompute/ariamodel-small: small — greetings, factoids, arithmetic (1+1=?), short lookups (emergency numbers, capitals), acronyms/stand-for, MCQ letter answers, yes/no, unit conversion
        ariacompute/ariamodel-mid: mid — systems judgment, trade-offs, reverse-proxy placement, multi-question comparisons
        ariacompute/ariamodel-large: large — only explain / walk-through / how-it-works teaching (not arithmetic, short lookups, MCQ, acronyms, or short facts)

global:
  require_api_key: false
