# Gold-path AFM-D config (YAML v0.3).
# Entrypoint: ariacompute/afm-d-auto. System One Choice over eligible models.
# No endpoint → first-eligible (demo/CI). Set afm-d.endpoint for aria-engine.
# entrypoint.router must equal recipe.router.

version: v0.3

listeners:
  - name: http
    address: 127.0.0.1
    port: 8899

providers:
  defaults:
    default_model: local/general
  models:
    - name: local/general
      provider_model_id: echo
      locality: local
      modality: text
      capabilities: [chat]
      backend_refs:
        - name: primary
          endpoint: 127.0.0.1:8000

entrypoints:
  - model_names: [ariacompute/afm-d-auto]
    router: afm-d
    recipe: afm-d-default

recipes:
  - name: afm-d-default
    router: afm-d
    afm-d:
      timeout_ms: 5000
      fallback: local/general
      instructions: |
        Pick the best model for this user request.

global:
  require_api_key: false
