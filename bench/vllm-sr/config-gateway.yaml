# vLLM Semantic Router v0.3 → Aria Gateway.
# Routing parity with config/examples/semantic-gateway.yaml recipe mom
# (signals / projections intent / decisions → ariamodel-{small,mid,large}).
# Listener :8890 (aria-router stays on :8899).
# Schema: https://vllm-sr.ai/docs/installation/configuration/
# Requires: export GATEWAY_API_KEY=…  (never commit secrets).
# Do not append /v1 to base_url.

version: v0.3

listeners:
  - name: http-8890
    address: 0.0.0.0
    port: 8890
    timeout: 300s

providers:
  defaults:
    default_model: ariacompute/ariamodel-mid
  models:
    - name: ariacompute/ariamodel-small
      provider_model_id: ariacompute/ariamodel-small
      backend_refs:
        - name: cloud/gateway
          base_url: https://gateway.ariacompute.com
          protocol: https
          weight: 100
          api_key_env: GATEWAY_API_KEY
    - name: ariacompute/ariamodel-mid
      provider_model_id: ariacompute/ariamodel-mid
      backend_refs:
        - name: cloud/gateway
          base_url: https://gateway.ariacompute.com
          protocol: https
          weight: 100
          api_key_env: GATEWAY_API_KEY
    - name: ariacompute/ariamodel-large
      provider_model_id: ariacompute/ariamodel-large
      backend_refs:
        - name: cloud/gateway
          base_url: https://gateway.ariacompute.com
          protocol: https
          weight: 100
          api_key_env: GATEWAY_API_KEY

routing:
  strategy: priority
  modelCards:
    - name: ariacompute/ariamodel-small
      modality: text
      capabilities: [chat]
    - name: ariacompute/ariamodel-mid
      modality: text
      capabilities: [chat]
    - name: ariacompute/ariamodel-large
      modality: text
      capabilities: [chat]
  signals:
    keywords:
      - name: needs_explain
        operator: OR
        keywords: ["explain", "walk me through"]
    language:
      - name: english
        description: English-language requests.
    context:
      - name: long_prompt
        min_tokens: "32"
        max_tokens: "8192"
        description: Medium/long prompts.
    role_bindings:
      - name: admin_role
        description: Requests from administrators.
        role: admin
        subjects:
          - kind: Group
            name: admins
    conversation:
      - name: multi_turn
        description: At least two user messages.
        feature:
          type: count
          source:
            type: message
            role: user
        predicate:
          gte: 2
    metadata:
      - name: tenant_acme
        description: Caller tenant is acme.
        key: tenant
        predicate:
          equals: acme
    events:
      - name: ticket
        description: Ticket-like event codes.
        event_types: [TICKET]
        action_codes: ["TICKET-"]
    structure:
      - name: multi_question
        description: Prompts with two or more explicit questions.
        feature:
          type: count
          source:
            type: regex
            pattern: '[?？]'
        predicate:
          gte: 2
  projections:
    partitions:
      - name: topic
        semantics: exclusive
        members: [needs_explain, ticket]
        default: needs_explain
    scores:
      - name: explain_score
        method: weighted_sum
        inputs:
          - type: keyword
            name: needs_explain
            weight: 1.0
            value_source: confidence
            match: 1.0
            miss: 0.0
          - type: context
            name: long_prompt
            weight: 0.3
            value_source: confidence
            match: 1.0
            miss: 0.0
    mappings:
      - name: explain_band
        source: explain_score
        method: threshold_bands
        outputs:
          - name: high
            gte: 0.8
          - name: default
            lt: 0.8
  decisions:
    - name: explanatory
      description: Keyword hit → static pick + request plugins
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: needs_explain
      modelRefs:
        - model: ariacompute/ariamodel-large
      algorithm:
        type: static
      plugins:
        - type: system_prompt
          configuration:
            enabled: true
            mode: insert
            system_prompt: Answer briefly and cite the routed model.
        - type: header_mutation
          configuration:
            add:
              - name: x-aria-route
                value: explanatory
        - type: request_params
          configuration:
            max_tokens_limit: 64
    - name: long_context
      description: Long prompt → latency-aware ranking
      priority: 80
      rules:
        operator: AND
        conditions:
          - type: context
            name: long_prompt
      modelRefs:
        - model: ariacompute/ariamodel-small
        - model: ariacompute/ariamodel-mid
        - model: ariacompute/ariamodel-large
      algorithm:
        type: latency_aware
        latency_aware:
          tpot_percentile: 90
          ttft_percentile: 95
          description: Rank candidates by observed latency for long prompts.
    - name: multi_turn
      description: Multi-turn chat → static mid tier
      priority: 60
      rules:
        operator: AND
        conditions:
          - type: conversation
            name: multi_turn
      modelRefs:
        - model: ariacompute/ariamodel-mid
      algorithm:
        type: static
    - name: multi_question
      description: Multi-question structure → static mid tier
      priority: 50
      rules:
        operator: AND
        conditions:
          - type: structure
            name: multi_question
      modelRefs:
        - model: ariacompute/ariamodel-mid
      algorithm:
        type: static
    - name: fallback_pool
      description: Default pool → multi-factor + exact response cache
      priority: 1
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: ariacompute/ariamodel-small
        - model: ariacompute/ariamodel-mid
        - model: ariacompute/ariamodel-large
      algorithm:
        type: multi_factor
        multi_factor:
          weights:
            quality: 0.4
            latency: 0.2
            cost: 0.2
            load: 0.2
          on_no_candidates: cheapest
      plugins:
        - type: semantic-cache
          configuration:
            enabled: true

global:
  services:
    observability:
      metrics:
        enabled: true
