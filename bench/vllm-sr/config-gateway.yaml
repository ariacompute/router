# vLLM Semantic Router v0.3 → Aria Gateway — **keyword baseline (frozen)**.
# Deliberately NOT synced to aria advanced semantic-gateway.yaml (§6.6 asymmetric).
# Baseline: explain → large; systems_mid (incl. architecture) → mid; else → small.
# Listener :8890 (aria-router stays on :8899).
# Schema: https://vllm-sr.ai/docs/installation/configuration/
# Requires: export GATEWAY_API_KEY=…  (never commit secrets).
# Do not enable semantic/response-cache here unless embedding models are ready
# (mmbert missing → Playground 500 on cache lookup).
# HTTPS Gateway backends need provider: openai (canonical; do not set
# backend_refs[].type — Go runtime rejects that deprecated field).
# base_url must include /v1 (Envoy uses chat_path=/chat/completions relative to it).

version: v0.3

listeners:
  - name: http-8890
    address: 0.0.0.0
    port: 8890
    timeout: 300s

providers:
  defaults:
    # Canonical v0.3 key is `model` (not deprecated `default_model`).
    model: ariacompute/ariamodel-mid
  models:
    - name: ariacompute/ariamodel-small
      provider_model_id: qwen3.5-flash
      backend_refs:
        - name: cloud/gateway
          base_url: https://tokenhub.tencentmaas.com/v1
          protocol: https
          weight: 100
          provider: openai
          auth_header: Authorization
          auth_prefix: Bearer
          api_key_env: GATEWAY_API_KEY
    - name: ariacompute/ariamodel-mid
      provider_model_id: glm-5.3
      backend_refs:
        - name: cloud/gateway
          base_url: https://tokenhub.tencentmaas.com/v1
          protocol: https
          weight: 100
          provider: openai
          auth_header: Authorization
          auth_prefix: Bearer
          api_key_env: GATEWAY_API_KEY
    - name: ariacompute/ariamodel-large
      provider_model_id: deepseek-v4-pro
      backend_refs:
        - name: cloud/gateway
          base_url: https://tokenhub.tencentmaas.com/v1
          protocol: https
          weight: 100
          provider: openai
          auth_header: Authorization
          auth_prefix: Bearer
          api_key_env: GATEWAY_API_KEY

routing:
  strategy: priority
  modelCards:
    - name: ariacompute/ariamodel-small
      modality: text
      capabilities: [chat]
    - name: ariacompute/ariamodel-mid
      modality: text
      capabilities: [chat]
    - name: ariacompute/ariamodel-large
      modality: text
      capabilities: [chat]
  signals:
    keywords:
      - name: needs_explain
        operator: OR
        keywords: ["explain", "walk me through"]
      - name: needs_intro
        operator: OR
        keywords: ["introduce", "introduction to", "what is", "what are", "how to", "how does", "overview of", "teach"]
      # Systems / design questions (bench tech-q1 / tech-q3) → mid tier.
      - name: needs_mid
        operator: OR
        keywords: ["reverse proxy", "trade-off", "tradeoff", "architecture"]
    language:
      - name: en
        description: English-language requests.
    context:
      - name: long_prompt
        min_tokens: "256"
        max_tokens: "8192"
        description: Long prompts (above short Playground turns).
    role_bindings:
      - name: admin_role
        description: Requests from administrators.
        role: admin
        subjects:
          - kind: Group
            name: admins
    conversation:
      - name: multi_turn
        description: At least two user messages.
        feature:
          type: count
          source:
            type: message
            role: user
        predicate:
          gte: 2
    metadata:
      - name: tenant_acme
        description: Caller tenant is acme.
        key: tenant
        predicate:
          equals: acme
    events:
      - name: ticket
        description: Ticket-like event codes.
        event_types: [TICKET]
        action_codes: ["TICKET-"]
    structure:
      - name: multi_question
        description: Prompts with two or more explicit questions.
        feature:
          type: count
          source:
            type: regex
            pattern: '[?？]'
        predicate:
          gte: 2
  # Aria semantic-gateway mom projections (partition over keyword/event) are omitted:
  # vLLM SR requires partition members to be domain or embedding signals only.
  # Decisions below do not reference projections.
  decisions:
    - name: explanatory
      description: Keyword hit → static pick + request plugins
      priority: 100
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: needs_explain
      modelRefs:
        - model: ariacompute/ariamodel-large
      algorithm:
        type: static
      plugins:
        - type: system_prompt
          configuration:
            enabled: true
            mode: insert
            system_prompt: Answer briefly and cite the routed model.
        - type: header_mutation
          configuration:
            add:
              - name: x-aria-route
                value: explanatory
    - name: intro_teach
      description: Intro / teaching asks (introduce X, what is X, how to) -> large
      priority: 95
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: needs_intro
      modelRefs:
        - model: ariacompute/ariamodel-large
      algorithm:
        type: static
      plugins:
        - type: system_prompt
          configuration:
            enabled: true
            mode: insert
            system_prompt: Answer thoroughly and teach the concept; cite the routed model.
        - type: header_mutation
          configuration:
            add:
              - name: x-aria-route
                value: intro_teach
        # No request_params max_tokens_limit — Gateway large models use reasoning
        # tokens first; a low cap yields empty Playground content.
    - name: long_context
      description: Long prompt → latency-aware ranking
      priority: 80
      rules:
        operator: AND
        conditions:
          - type: context
            name: long_prompt
      modelRefs:
        - model: ariacompute/ariamodel-small
        - model: ariacompute/ariamodel-mid
        - model: ariacompute/ariamodel-large
      algorithm:
        type: latency_aware
        latency_aware:
          tpot_percentile: 90
          ttft_percentile: 95
          description: Rank candidates by observed latency for long prompts.
    - name: systems_mid
      description: Systems / trade-off prompts → static mid tier
      priority: 70
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: needs_mid
      modelRefs:
        - model: ariacompute/ariamodel-mid
      algorithm:
        type: static
      plugins:
        - type: header_mutation
          configuration:
            add:
              - name: x-aria-route
                value: systems_mid
    - name: multi_turn
      description: Multi-turn chat → static mid tier
      priority: 60
      rules:
        operator: AND
        conditions:
          - type: conversation
            name: multi_turn
      modelRefs:
        - model: ariacompute/ariamodel-mid
      algorithm:
        type: static
    - name: multi_question
      description: Multi-question structure → static mid tier
      priority: 50
      rules:
        operator: AND
        conditions:
          - type: structure
            name: multi_question
      modelRefs:
        - model: ariacompute/ariamodel-mid
      algorithm:
        type: static
    - name: fallback_pool
      description: Default gold path → ariamodel-small (static; no semantic-cache — needs embeddings)
      priority: 1
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: ariacompute/ariamodel-small
      algorithm:
        type: static

global:
  services:
    observability:
      metrics:
        enabled: true
  stores:
    # Keep the deprecated alias key: `vllm-sr serve` injects
    # global.stores.semantic_cache defaults into runtime-config.yaml. Setting
    # response_cache alongside that injection fatals with
    # "response_cache conflicts with deprecated … semantic_cache".
    # Without mmbert embeddings, leave enabled: false (else Playground 500).
    semantic_cache:
      enabled: false
