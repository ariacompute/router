[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ariacompute-router"
version = "0.1.0"
description = "Python SDK for aria-router (ctypes over libaria_router_ffi)"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aria Compute" }]

[tool.setuptools.packages.find]
include = ["aria_router*"]

[tool.setuptools.package-data]
aria_router = ["lib/*.so", "lib/*.dylib", "lib/*.dll"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*musllinux*"
archs = ["auto"]
test-command = "python -c \"from aria_router import Router; print('ok')\""
